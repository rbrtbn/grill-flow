<style>
body { background: var(--paper); color: var(--ink); margin: 0; font-family: var(--read); }
.proto-main { max-width: 900px; margin: 0 auto; padding: 28px 16px 120px; }
.proto-head { display: grid; gap: 6px; margin-bottom: 18px; }
.proto-head h1 { font: 700 1.5rem var(--read); margin: 0; }
.proto-note { font: 500 0.95rem/1.45 var(--label); color: var(--muted); max-width: 46rem; margin: 0; }
.proto-note b { color: var(--ink); }
.proto-state { position: fixed; left: 16px; bottom: 16px; max-width: 260px; font: 500 0.75rem/1.4 var(--code); color: var(--muted); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; z-index: 50; }
.switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); font: 600 0.9rem system-ui, sans-serif; }
.switcher button { background: transparent; border: 0; color: #fff; font-size: 1.1rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
.switcher button:hover { background: #333; }
.switcher span { padding: 0 10px; min-width: 300px; text-align: center; }
@media (max-width: 700px) { .switcher span { min-width: 0; } .proto-state { display: none; } }

/* Shared bits for A-D */
.link-button { background: none; border: 0; padding: 0; font: 600 0.88rem var(--label); color: var(--link); cursor: pointer; }
.link-button:hover { text-decoration: underline; }
.quiet { color: var(--muted); }
.meta { font: 500 0.84rem var(--label); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.meta .sep::before { content: '·'; margin-right: 12px; }
.chipline b { color: var(--link); }

/* A: the same card with every repeat cut */
.va .question-body { gap: 12px; padding-bottom: 20px; }
.va .question-ask { font-size: 1.08rem; }
.va .options { gap: 0; border: 1px solid var(--rule); border-radius: 4px; }
.va .option { border: 0; border-radius: 0; padding: 8px 12px; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 10px; }
.va .option + .option { border-top: 1px solid var(--rule); }
.va .option.is-selected { box-shadow: inset 3px 0 0 var(--link); }
.va .option-key { width: 1.4rem; height: 1.4rem; font-size: 0.82rem; }
.va .option-body { display: block; }
.va .option-label { display: inline; }
.va .option-effect { display: inline; }
.va .option-effect::before { content: ' — '; }
.va .foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.va .foot .meta { margin-left: auto; }
.va .note-box { width: 100%; box-sizing: border-box; }

/* B: the question is the headline, choices are one row of buttons */
.vb .row-title { font-size: 1rem; }
.vb .question.is-expanded > .row { padding-bottom: 4px; }
.vb .question.is-expanded .row-title { font-size: 1rem; color: var(--muted); }
.vb .question-body { gap: 12px; }
.vb .question-ask { font-size: 1.3rem; line-height: 1.35; }
.vb .choices { display: flex; flex-wrap: wrap; gap: 8px; }
.vb .choice { font: 600 0.95rem var(--read); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--ink); }
.vb .choice:hover, .vb .choice:focus-visible { border-color: var(--link); }
.vb .choice .k { font: 700 0.85rem var(--label); color: var(--link); margin-right: 6px; }
.vb .choice.is-rec { border-color: var(--link); }
.vb .choice.is-rec::after { content: '★'; margin-left: 6px; color: var(--link); font-size: 0.8em; }
.vb .choice.is-selected { background: var(--link); border-color: var(--link); color: var(--paper); }
.vb .choice.is-selected .k, .vb .choice.is-selected::after { color: var(--paper); }
.vb .choice.own { border-style: dashed; color: var(--muted); }
.vb .effect { font-size: 0.95rem; color: var(--muted); min-height: 1.45em; margin: 0; }
.vb .effect b { color: var(--ink); font-weight: 600; }
.vb .foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }

/* C: the question on the left, everything about it in a rail on the right */
.vc .question-body { grid-template-columns: minmax(0, 1fr) 13rem; gap: 14px 24px; padding-left: 3.95rem; }
.vc .main { display: grid; gap: 12px; align-content: start; }
.vc .rail { display: grid; gap: 12px; align-content: start; border-left: 1px solid var(--rule); padding-left: 16px; font: 500 0.86rem/1.35 var(--label); }
.vc .rail dt { font: 600 0.72rem var(--label); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.vc .rail dd { margin: 2px 0 0; }
.vc .rail dl { margin: 0; display: grid; gap: 10px; }
.vc .rail .actions { display: grid; gap: 6px; justify-items: start; }
.vc .question-ask { font-size: 1.1rem; }
.vc .option { padding: 8px 12px; }
.vc .option-key { width: 1.5rem; height: 1.5rem; font-size: 0.85rem; }
.vc .option.own, .va .option.own { grid-template-columns: 1.5rem minmax(0, 1fr); gap: 12px; cursor: pointer; align-items: center; }
@media (max-width: 760px) { .vc .question-body { grid-template-columns: 1fr; padding-left: 4px; } .vc .rail { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 10px; } }

/* D: answer from the row; opening it adds only the ask and what each choice does */
.vd .drow { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; }
.vd .drow .row-title { cursor: pointer; }
.vd .pills { display: flex; gap: 4px; flex-wrap: nowrap; }
.vd .pill-k { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); font: 700 0.9rem var(--label); cursor: pointer; color: var(--ink); position: relative; }
.vd .pill-k:hover { border-color: var(--link); }
.vd .pill-k.is-rec { border-color: var(--link); color: var(--link); }
.vd .pill-k.is-selected { background: var(--link); border-color: var(--link); color: var(--paper); }
.vd .pill-k.own { border-style: dashed; }
.vd .pill-k:disabled { opacity: 0.4; cursor: default; }
.vd .dbody { padding: 0 4px 18px 3.95rem; display: grid; gap: 10px; }
.vd .dbody .question-ask { font-size: 1.05rem; }
.vd .effects { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 0.93rem; }
.vd .effects dt { font: 700 0.9rem var(--label); color: var(--link); }
.vd .effects dd { margin: 0; color: var(--muted); }
.vd .effects dd b { color: var(--ink); font-weight: 600; }
.vd .effects .rec-tag { font: 600 0.72rem var(--label); letter-spacing: 0.05em; text-transform: uppercase; color: var(--link); margin-left: 6px; }
.vd .dfoot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.vd .answer-tag { font: 500 0.88rem var(--label); color: var(--muted); }
</style>

const variantD = () => DATA.questions.map(q => {
  const st = state(q)
  const pills = st === 'waiting' ? `<span class="answer-tag">Waits for ${q.waitsOn.join(', ')}</span>` :
    `<span class="pills" role="radiogroup" aria-label="${q.id}">${q.options.map(o => `<button class="pill-k${o.recommended ? ' is-rec' : ''}${S.answers[q.id] === o.key ? ' is-selected' : ''}" title="${esc(o.label)}${o.recommended ? ' (recommended)' : ''}" data-pick="${q.id}:${o.key}">${o.key}</button>`).join('')}<button class="pill-k own${S.answers[q.id] === '?' ? ' is-selected' : ''}" title="My own answer" data-pick="${q.id}:?">?</button></span>`
  return `<section class="${sectionClass(q)}">
  <div class="drow"><span class="row-id">${q.id}</span><span class="row-main" data-toggle="${q.id}"><span class="row-title">${ref(q.issue)}${esc(q.heading)}${dot(q.urgency, true)}</span>${st === 'answered' ? `<span class="answer-tag"><b class="quiet">${S.answers[q.id]}</b> ${esc(optLabel(q, S.answers[q.id]))}</span>` : `<span class="scope">${esc(q.scope)}</span>`}</span>${pills}</div>
  ${S.open !== q.id ? '' : `<div class="dbody">
    <p class="question-ask">${rich(q.ask)}</p>
    <dl class="effects">${q.options.map(o => `<dt>${o.key}</dt><dd><b>${esc(o.label)}</b>${o.recommended ? '<span class="rec-tag">Recommended</span>' : ''} — ${rich(o.effect)}</dd>`).join('')}</dl>
    ${S.noteOpen[q.id] || S.notes[q.id] ? noteBox(q) : ''}
    <div class="dfoot">${noteLink(q)}<button class="link-button">Why, and talk about it →</button><span class="meta">${outsideLine(q)}${outsideLine(q) ? '<span class="sep"></span>' : ''}${from(q)}</span></div>
  </div>`}
</section>`
}).join('')

const current = () => document.getElementById('current').innerHTML

const VARIANTS = [
  ['Now', 'The page as it is', current, 'The live page\'s own markup for card cos-hardening-13, Q51 open, for comparison. Not clickable.'],
  ['A', 'Same card, repeats cut', variantA, '<b>Cut:</b> the second LAB-1105, the Applies box (the scope is already under the title), the Q51 before the ask, the squad line (its source moves to the foot), Ask about Q51 (the Why link now opens Talk), Close (the title row closes it), and the note box until you ask for one. <b>Tightened:</b> options are one line each, effect after the label.'],
  ['B', 'The question is the headline', variantB, 'The ask is the biggest line; the title row above it steps back. Choices are one row of buttons, the recommended one starred. What a choice does shows under them: the recommended one until you hover or pick another. Scope and source sit in one small line.'],
  ['C', 'Details in a side rail', variantC, 'The left column is only what you answer: the ask and the options. Applies, issue, urgency, source and what it builds on move to a narrow rail on the right, with the links. On a phone the rail drops below.'],
  ['D', 'Answer from the row', variantD, 'Each open question\'s row carries its choices as a, b, c, ? buttons (recommended outlined, hover for the label), so a question you already understand never needs opening. Opening one adds only the ask and a compact list of what each choice does.'],
]
const keyOf = () => { const v = new URLSearchParams(location.search).get('variant'); return VARIANTS.some(x => x[0] === v) ? v : 'A' }
const render = () => {
  const [key, name, fn, note] = VARIANTS.find(x => x[0] === keyOf())
  document.getElementById('vtitle').textContent = `${key}: ${name}`
  document.getElementById('vnote').innerHTML = note
  document.getElementById('vlabel').textContent = `${key} (${name})  ·  ${VARIANTS.findIndex(x => x[0] === key) + 1}/${VARIANTS.length}`
  document.getElementById('stage').innerHTML = `<div class="questions v${key.toLowerCase()}">${key === 'Now' ? '' : fn()}</div>`
  if (key === 'Now') document.getElementById('stage').innerHTML = `<div class="questions">${fn()}</div>`.replace('<div class="questions"><section', '<div class="questions" style="pointer-events:none"><section')
  document.getElementById('state').textContent = JSON.stringify({ variant: key, open: S.open, picked: Object.fromEntries(Object.entries(S.answers).filter(([k]) => !DATA.questions.find(q => q.id === k)?.answer || DATA.questions.find(q => q.id === k).answer !== S.answers[k])), notes: S.notes }, null, 1)
}
const go = step => {
  const i = VARIANTS.findIndex(x => x[0] === keyOf())
  const next = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length][0]
  const url = new URL(location.href); url.searchParams.set('variant', next); history.replaceState(null, '', url); render()
}
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'ArrowLeft') go(-1)
  if (e.key === 'ArrowRight') go(1)
})
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle], [data-pick], [data-addnote]')
  if (!t) return
  if (t.dataset.toggle) { S.open = S.open === t.dataset.toggle ? null : t.dataset.toggle }
  if (t.dataset.pick) { const [q, k] = t.dataset.pick.split(':'); if (S.answers[q] === k) delete S.answers[q]; else S.answers[q] = k; if (k === '?') S.noteOpen[q] = true }
  if (t.dataset.addnote) { S.noteOpen[t.dataset.addnote] = true }
  render()
  if (t.dataset.addnote) document.querySelector(`[data-note="${t.dataset.addnote}"]`)?.focus()
})
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-hover]'); if (!t) return
  const [q, k] = t.dataset.hover.split(':'); if (S.hover[q] === k) return
  S.hover[q] = k; const p = t.closest('.question-body')?.querySelector('.effect')
  const qq = DATA.questions.find(x => x.id === q); const o = qq.options.find(x => x.key === k)
  if (p && o) p.innerHTML = `<b>${o.key}${o.recommended ? ', recommended' : ''}:</b> ${rich(o.effect)}`
})
document.addEventListener('mouseout', e => {
  const t = e.target.closest('[data-hover]'); if (!t || t.contains(e.relatedTarget)) return
  const [q] = t.dataset.hover.split(':'); delete S.hover[q]
  const qq = DATA.questions.find(x => x.id === q); const k = S.answers[q] ?? qq.options.find(o => o.recommended)?.key; const o = qq.options.find(x => x.key === k)
  const p = t.closest('.question-body')?.querySelector('.effect'); if (p && o) p.innerHTML = `<b>${o.key}${o.recommended ? ', recommended' : ''}:</b> ${rich(o.effect)}`
})
document.addEventListener('input', e => { const n = e.target.dataset?.note; if (n) { S.notes[n] = e.target.value; document.getElementById('state').textContent = JSON.stringify({ variant: keyOf(), open: S.open, notes: S.notes }, null, 1) } })
render()
</script>
</body>
</html>
